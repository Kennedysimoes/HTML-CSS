<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border-collapse: collapse;
            width: 500px;
            font-family: Arial, Helvetica, sans-serif;
        }

        td, th{
            padding: 10px;
            border: 1px solid black;
        }

        caption{
            font-weight: bolder;
            padding: 10px;
            font-size: 1.2em
        }

        .nome{
            background-color: yellow;
        }
        .idade{
            background-color: skyblue;
        }
        .profissao{
            background-color: blanchedalmond;
        }
        .cidade{
            background-color: green;
        }
    </style>
</head>
<body>
    <h1>Exercício de Tabela</h1>
    <table>
        <colgroup>
            <col class="nome"> 
            <col class="idade" span="2"> 
            <col class="profissao">
            <col class="cidade">
        </colgroup>
        <caption>
            Cadastro
        </caption>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Sexo</th>
                <th>Idade</th>
                <th>Profissão</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana Maria</td>
                <td>F</td>
                <td>25</td>
                <td>Jornalista</td>
                <td>AM</td>
            </tr>
            <tr>
                <td>Claudio</td>
                <td>M</td>
                <td>28</td>
                <td>Programador</td>
                <td>RS</td>
            </tr>
            <tr>
                <td>Gustavo</td>
                <td>M</td>
                <td>42</td>
                <td>Professor</td>
                <td>SP</td>
            </tr>
            <tr>
                <td>Hélio</td>
                <td>M</td>
                <td>19</td>
                <td>Vendedor</td>
                <td>RJ</td>
            </tr>
            <tr>
                <td>Maria</td>
                <td>F</td>
                <td>28</td>
                <td>Médica</td>
                <td>FE
                </td>
            </tr>
            <tr>
                <td>Ótavio</td>
                <td>M</td>
                <td>22</td>
                <td>Nutricionista</td>
                <td>MG</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
