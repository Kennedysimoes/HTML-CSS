<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="shortcut icon" href="HTML.ico" type="image/x-icon">
    <style>
        table{
            border-collapse: collapse;
            
        }
        td{
            border: 1px solid black;
            padding: 5px;
            width: 100px;
            font-family: Arial, Helvetica, sans-serif;
            padding-left: 5px;
            
        }
        #linha_02{
            background-color: gray;
        }
        
        #dado{
            background-color: yellow;
        }

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr id="Linha_01">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr id="linha_02">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr id="linha_04">
            <td>A4</td>
            <td id="dado">B4</td>
            <td>C4</td>
        </tr>
        <tr>
            <td>A5</td>
            <td>B5</td>
        </tr>
        <tr>
            <td>A6</td>
        </tr>
    </table>
</body>
</html>
