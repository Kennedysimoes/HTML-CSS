<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            background-color: grey;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isexomas" value="M">
            <label for="isexomas">Masculiuno</label> <br>
            <input type="radio" name="sexo" id="isexofem" value="F">
            <label for="isexofem">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="espfut" id="iespfut">
            <label for="iespfut">Futbeol</label> <br>
            <input type="checkbox" name="espnata" id="iespnata">
            <label for="iespnata">Natação</label> <br>
            <input type="checkbox" name="espvolei" id="iespvolei">
            <label for="iespvolei">Vôlei</label> <br>
            <input type="checkbox" name="espbasq" id="iespbasq">
            <label for="iespbasq">Basquete</label> 
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>


</body>
</html>
