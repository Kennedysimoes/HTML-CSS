<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        body{
            background-color: grey;
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Testew de formulário</h1>
    <form action="cadastro.php" method="get" autocomplete="off">

        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required maxlength="10" minlength="3" placeholder="Nome completo" autocomplete="name" size="50">
        </p>

        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="media" id="imedia" step="0.1" required min="0" max="10" value="6.0">
        </p>
        
        <p>
            <label for="imes">Mês</label>
            <input type="month" name="mes" id="imes" required value="2025-01">
        </p>

        <p>
            <label for="idia">Dia da Prova</label>
            <input type="date" name="dia" id="idia" required value="2020-06-04">
        </p>

        <p>
            <label for="ihora">Horário da Prova</label>
            <input type="time" name="hora" id="ihora" required>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
