<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        #conteiner{
            background-color: rgb(226, 142, 73);
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
        }
        .son{
            background-color: skyblue;
            padding: 20px;
            border: 1px solid black;
            
        }
        #i1{
            order: 0;
        }
        #i2{
            order: -2;
        }

        #i3{
            order: 4;
        }

        #i4{
            order: 8;
        }

        #i5{
            order: 2;
        }

        #i6{
            order: 0;
        }

        #i7{
            order: -4;
        }

    </style>
</head>
<body>
    <div id="conteiner">
        <div class="son" id="i1">A</div>
        <div class="son" id="i2">B</div>
        <div class="son" id="i3">C</div>
        <div class="son" id="i4">D</div>
        <div class="son" id="i5">E</div>
        <div class="son" id="i6">F</div>
        <div class="son" id="i7">G</div>
    </div>
</body>
</html>
