<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        #conteiner{
            display: flex;
            background-color: rgb(197, 156, 66);
            flex-flow: row wrap;
        }

        .item{
            border: 1px solid black;
            text-align: center;
            background-color: lightskyblue;
            flex-basis: auto;
            padding: 10px;

        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="item">A</div>
        <div class="item">Conteudo maior</div>
        <div class="item">C</div>
        <div class="item">Conteudo maior ainda</div>
        <div class="item">E</div>
        <div class="item">Conteudo mais maior ainda que todos</div>
        <div class="item">G</div>
    </div>
</body>
</html>
