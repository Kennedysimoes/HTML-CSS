<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        #conteiner{
            background-color: lightpink;
            display: flex;
            flex-direction: row-reverse;
            flex-wrap: wrap;
            justify-content: space-around;
            
        }

        .item{
            border: 1px solid black;
            text-align: center;
            background-color: lightskyblue;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="item">Caixa da letra A</div>
        <div class="item">Caixa da letra B</div>
        <div class="item">Caixa da letra C</div>
        <div class="item">Caixa da letra D</div>
        <div class="item">Caixa da letra E</div>
        <div class="item">Caixa da letra F</div>
        <div class="item">Caixa da letra G</div>
    </div>
</body>
</html>
