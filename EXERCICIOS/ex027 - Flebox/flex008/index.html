<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        #conteiner{
            display: flex;
            background-color: blanchedalmond;
            flex-flow: row wrap;
            justify-content: flex-start;
            height: 500px;
            align-items: flex-start;                                             
        }

        .filho{
            background-color: cadetblue;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        }

        #f1{
            align-self: flex-start;
        }

        #f2{
            align-self: auto;
        }

        #f3{
            align-self: flex-end;
        }

        #f4{
            align-self: center;
        }

        #f5{
            align-self: stretch;
        }
        
        #f6{
            align-self: center;
        }

        #f7{
            align-self: auto;
        }

    </style>
</head>
<body>
    <div id="conteiner">
        <div class="filho" id="f1">A</div>
        <div class="filho" id="f2">B</div>
        <div class="filho" id="f3">C</div>
        <div class="filho" id="f4">D</div>
        <div class="filho" id="f5">E</div>
        <div class="filho" id="f6">F</div>
        <div class="filho" id="f7">G</div>
    </div>
</body>
</html>
