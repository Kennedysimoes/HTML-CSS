<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        #conteiner{
            background-color: rgb(199, 148, 54);
            display: flex;
            flex-flow: row nowrap;

        }
        .filho{
            background-color: skyblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
        }

        #f1{
            flex-shrink: 0;
            flex-grow: 0;
        }

        #f2{
            flex-shrink: 2;
            flex-grow: 0;
        }

        #f3{
            flex-shrink: 4;
            flex-grow: 0;
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="filho" id="f1">A</div>
        <div class="filho" id="f2">B</div>
        <div class="filho" id="f3">C</div>
    </div>
</body>
</html>
