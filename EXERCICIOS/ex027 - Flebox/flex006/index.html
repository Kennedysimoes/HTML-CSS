<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width= , initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        #conteiner{
            display: flex;
            background-color: blanchedalmond;
            flex-flow: row wrap;
            justify-content: center;
            height: 600px;
            align-items: stretch;
            align-content: space-around;
            
        }

        .filho{
            background-color: cadetblue;
            border: 1px solid black;
            padding: 40px;
            text-align: center;
            
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
        <div class="filho">H</div>
        <div class="filho">I</div>
        <div class="filho">J</div>
        <div class="filho">K</div>
    </div>
</body>
</html>
