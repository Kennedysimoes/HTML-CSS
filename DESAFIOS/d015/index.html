<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        th, td{
            border: 1px solid black;
            padding: 10px;
        }

        td{
            text-align: center;
        }

        th{
            background-color: grey;
            color: white;
        }

        .sub{
            background-color: white;
            color: black;
        }

        .medias{
            background-color: grey;
            text-align: left;
        }

        .linha_media{
            background-color: grey;
            color: white;
            font-weight: 600;
        }

    </style>
</head>
<body>
    <table>
        <tr>
            <th rowspan="2" scope="row">Área </th>
            <th rowspan="2" scope="row">Disciplina</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
        </tr>
        <tr>
            <th scope="col">Nota 1</th>
            <th scope="col">Nota 2</th>
        </tr>
        <tr>
            <th rowspan="4" class="sub" scope="rowgroup">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Fisica</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="linha_media">
            <td colspan="4" class="medias">Média de exatas</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th rowspan="2" class="sub" scope="rowgroup">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr class="linha_media">
            <td colspan="4" class="medias">Média de Humanas</td>
            <td>0.0</td>
        </tr>
    </table>
</body>
</html>
